name: Test aarch64 build

on:
  workflow_dispatch:
  push:
    branches: [aarch64-glibc-2.35-compat]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"

jobs:
  build-linux-aarch64:
    name: Build (aarch64, glibc 2.35 + emulated TLS)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation prerequisites
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cat > /etc/apt/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe
          EOF
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates git gcc g++ gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config
          git config --global --add safe.directory '*'

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
          components: rust-src

      - name: Build release binary
        env:
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include/openssl
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-Z", "tls-model=emulated"]
          EOF
          cargo +nightly build --locked --release -Z build-std=std,panic_abort --target aarch64-unknown-linux-gnu

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/jcode dist/jcode-linux-aarch64
          chmod +x dist/jcode-linux-aarch64
          cd dist && tar czf jcode-linux-aarch64.tar.gz jcode-linux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with</longcat_arg_key>
<longcat_arg_value>{          name: jcode-linux-aarch64
          path: dist/jcode-linux-aarch64.tar.gz
          retention-days: 7
