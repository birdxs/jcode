name: Build aarch64 with glibc compat

on:
  workflow_dispatch:

jobs:
  build:
    container: ubuntu:22.04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler and OpenSSL
        run: |
          dpkg --add-architecture arm64
          apt-get update 2>&1 | grep -v "404\|Not Found" || true
          apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jcode-aarch64-compat
          path: target/aarch64-unknown-linux-gnu/release/jcode
