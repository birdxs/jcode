name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    container: ubuntu:22.04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          dpkg --add-architecture arm64
          cat > /etc/apt/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe
          EOF
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gcc g++ gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include/openssl
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "SHA256SUMS" 2>/dev/null || true
          cp target/aarch64-unknown-linux-gnu/release/jcode ./jcode-linux-aarch64
          sha256sum jcode-linux-aarch64 >> SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" jcode-linux-aarch64 SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
