name: Build static binary for Linux aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross (cross-compilation tool)
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build static binary (aarch64-unknown-linux-musl)
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jcode-linux-aarch64-static
          path: target/aarch64-unknown-linux-musl/release/jcode
