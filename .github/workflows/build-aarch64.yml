name: Build aarch64 with glibc compat

on:
  workflow_dispatch:

jobs:
  build:
    # AlmaLinux 8 has glibc 2.28, compatible with openEuler 24.03's glibc 2.38
    container: almalinux:8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross-compiler
        run: |
          dnf install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jcode-linux-aarch64-compat
          path: target/aarch64-unknown-linux-gnu/release/jcode
