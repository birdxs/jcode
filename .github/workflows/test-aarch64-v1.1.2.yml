name: Test aarch64 v1.1.2 (mirror of release-aarch64.yml)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Exactly the steps in release-aarch64.yml (no cmake, no git-before-checkout).
  as-is:
    name: as-is (release-aarch64.yml)
    container: ubuntu:22.04
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          dpkg --add-architecture arm64
          cat > /etc/apt/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe
          EOF
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gcc g++ gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include/openssl
          JCODE_RELEASE_BUILD: "1"
          JCODE_BUILD_SEMVER: v1.1.2
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package
        if: success()
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/jcode dist/jcode-linux-aarch64
          tar czf dist/jcode-linux-aarch64.tar.gz -C dist jcode-linux-aarch64

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: as-is-jcode-linux-aarch64
          path: dist/jcode-linux-aarch64.tar.gz
          if-no-files-found: error

  # Same build, plus cmake/make and git installed before checkout.
  fixed:
    name: fixed (+cmake +git-before-checkout)
    container: ubuntu:22.04
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cat > /etc/apt/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe
          EOF
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates git cmake make gcc g++ gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build release
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include/openssl
          JCODE_RELEASE_BUILD: "1"
          JCODE_BUILD_SEMVER: v1.1.2
        run: |
          set -euo pipefail
          export JCODE_BUILD_GIT_HASH="$(git rev-parse --short HEAD)"
          export JCODE_BUILD_GIT_DATE="$(git log -1 --format=%ci)"
          export JCODE_BUILD_GIT_TAG="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          export JCODE_BUILD_CHANGELOG_RAW="$(git log -700 --format='%h|%ct|%D|%s')"
          echo "git metadata: ${JCODE_BUILD_GIT_HASH} / ${JCODE_BUILD_GIT_DATE}"
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package
        if: success()
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/jcode dist/jcode-linux-aarch64
          tar czf dist/jcode-linux-aarch64.tar.gz -C dist jcode-linux-aarch64

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fixed-jcode-linux-aarch64
          path: dist/jcode-linux-aarch64.tar.gz
          if-no-files-found: error